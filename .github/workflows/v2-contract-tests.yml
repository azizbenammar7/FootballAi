name: V2 analysis-run contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPYCACHEPREFIX: /tmp/footballai-pycache

jobs:
  bounded-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Validate Python syntax
        run: python -m compileall -q v2/src v2/tests tests pipeline scripts dashboard

      - name: Run V1 characterization and V2 contract tests
        run: PYTHONPATH=v2/src python -m pytest -q -ra
