name: V2 platform tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPYCACHEPREFIX: /tmp/footballai-pycache

jobs:
  bounded-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Validate Python syntax
        run: python -m compileall -q v2/src v2/tests tests pipeline scripts dashboard

      - name: Run V1 characterization and V2 contract tests
        run: PYTHONPATH=v2/src python -m pytest -q -ra

      - name: Reject whitespace and generated-file drift
        run: git diff --check

  dashboard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: v2/dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: v2/dashboard/package-lock.json

      - name: Install locked dashboard dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check, lint, unit-test, and build dashboard
        run: npm run check

  dashboard-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: v2/dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install local API dependencies
        working-directory: ${{ github.workspace }}
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: v2/dashboard/package-lock.json

      - name: Install locked dashboard dependencies
        run: npm ci --no-audit --no-fund

      - name: Build dashboard
        run: npm run build

      - name: Install bounded Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Confirm generated-fixture media tool
        run: ffmpeg -version

      - name: Run local dashboard smoke test
        env:
          FOOTBALLAI_V2_PYTHON: python
        run: npm run test:e2e
