# DevSecOps gates: secret scanning, SAST, dependency audits, and IaC scanning.
# No Azure, no id-token, no secrets — safe for fork PRs. Each gate fails the
# build on real findings; documented exceptions live in .gitleaks.toml,
# .trivyignore, and inline `# nosemgrep` justifications (never blanket ignores).
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC (catches newly-published advisories)

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz as listed in the
      # official release's gitleaks_${GITLEAKS_VERSION}_checksums.txt. Update it
      # only together with GITLEAKS_VERSION, in a reviewed PR.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so historical secrets are caught
      - name: Install Gitleaks (pinned, SHA-256 verified)
        # Fails closed: if the official binary cannot be downloaded, does not
        # match the pinned checksum, or reports another version, the job fails
        # and the scan step never runs.
        run: |
          set -euo pipefail
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive="$RUNNER_TEMP/$asset"
          headers="$RUNNER_TEMP/gitleaks-download.headers"
          max_attempts=5

          for attempt in $(seq 1 "$max_attempts"); do
            rm -f "$archive" "$headers"
            rc=0
            status="$(curl --silent --show-error --location \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 15 --max-time 40 \
              --dump-header "$headers" --output "$archive" \
              --write-out '%{http_code}' "$release/$asset")" || rc=$?
            if [ "$rc" -eq 0 ] && [ "$status" = "200" ]; then
              echo "Downloaded $asset (attempt $attempt/$max_attempts)."
              break
            fi
            echo "::warning::Gitleaks download attempt $attempt/$max_attempts failed: HTTP ${status:-none}, curl exit $rc."
            # Status line of every hop plus rate-limit/redirect diagnostics.
            grep -iE '^(HTTP/|location:|retry-after:|x-ratelimit-|x-github-request-id:)' "$headers" 2>/dev/null || true
            case "$status" in
              404|410)
                echo "::error::$release/$asset does not exist (HTTP $status). Check GITLEAKS_VERSION. Secret scan NOT run."
                exit 1 ;;
            esac
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Could not download Gitleaks after $max_attempts attempts. Secret scan NOT run."
              exit 1
            fi
            delay=$((attempt * 5))
            # Honour a numeric Retry-After (seconds), capped at 30s. Worst case
            # 5 x 40s + 4 x 30s stays inside the job's 8-minute timeout.
            retry_after="$(tr -d '\r' 2>/dev/null < "$headers" | sed -n 's/^[Rr]etry-[Aa]fter: *\([0-9]\{1,4\}\)$/\1/p' | tail -n 1 || true)"
            if [ -n "$retry_after" ] && [ $((10#$retry_after)) -gt "$delay" ]; then
              delay=$(( 10#$retry_after < 30 ? 10#$retry_after : 30 ))
            fi
            echo "Retrying in ${delay}s."
            sleep "$delay"
          done

          actual="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          if ! [[ "$GITLEAKS_SHA256" =~ ^[0-9a-f]{64}$ ]] || [ "$actual" != "$GITLEAKS_SHA256" ]; then
            echo "::error::$asset SHA-256 mismatch. Expected '${GITLEAKS_SHA256}', got '${actual}'. Secret scan NOT run."
            # Reviewer aid only, never used to pass: what the release's own checksum file lists.
            curl --silent --show-error --fail --location --proto '=https' --proto-redir '=https' \
              --max-time 30 "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
              | awk -v a="$asset" '$2 == a' || echo "(official checksums file unavailable)"
            exit 1
          fi
          echo "SHA-256 verified: $actual  $asset"

          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          reported="$("$RUNNER_TEMP/gitleaks" version)"
          if [ "$reported" != "$GITLEAKS_VERSION" ]; then
            echo "::error::Gitleaks reports version '$reported', expected $GITLEAKS_VERSION. Secret scan NOT run."
            exit 1
          fi
          echo "Gitleaks $reported installed."
      - name: Scan full git history
        run: "$RUNNER_TEMP/gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 ."

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Scan Python + TypeScript source
        run: |
          semgrep scan --error --metrics off \
            --config p/python --config p/typescript --config p/security-audit \
            v2/src pipeline scripts dashboard v2/dashboard/src

  python-deps:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit runtime dependency locks (fail on any known vulnerability)
        # Covers the security-sensitive API + worker runtime (PostgreSQL/Azure), plus
        # the copilot evaluation SDK, which CI installs but no runtime image does.
        # The v1-compat ML lock (torch) is audited out-of-band, not gated here.
        run: |
          pip-audit --progress-spinner off \
            -r v2/requirements-api.txt \
            -r v2/requirements-postgres.txt \
            -r v2/requirements-azure.txt \
            -r v2/requirements-worker-core.txt \
            -r v2/requirements-copilot-eval.txt

  npm-deps:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: v2/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: v2/dashboard/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Fail on HIGH or CRITICAL advisories
        run: npm audit --audit-level=high

  trivy-iac:
    name: IaC scan (Trivy config)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan Terraform for HIGH/CRITICAL misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
