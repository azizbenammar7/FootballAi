[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "footballai-v2"
version = "0.1.0"
description = "Professional V2 platform for FootballAi"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "fastapi==0.162.0",
  "httpx2==2.16.0",
  "jsonschema==4.26.0",
  "pytest==8.4.1",
  "python-multipart==0.0.32",
  # P2 cloud-adapter test dependencies (integration tests skip without emulators).
  "SQLAlchemy==2.1.6",
  "psycopg==3.3.6",
  "alembic==1.20.1",
  "azure-storage-blob==12.31.0",
  "azure-servicebus==7.15.0",
  "azure-identity==1.27.0",
]
api = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
]
# P2 control plane (PostgreSQL). See requirements-postgres.txt for the pinned lock.
postgres = [
  "SQLAlchemy==2.1.6",
  "psycopg==3.3.6",
  "alembic==1.20.1",
]
# P2 cloud data plane + queue (Azure). See requirements-azure.txt for the lock.
cloud = [
  "azure-storage-blob==12.31.0",
  "azure-servicebus==7.15.0",
  "azure-identity==1.27.0",
]

# Copilot real-model evaluation only: the API and worker images never install it.
# See requirements-copilot-eval.txt for the lock.
copilot-eval = [
  "anthropic==2.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
