[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "footballai-v2"
version = "0.1.0"
description = "Professional V2 platform for FootballAi"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "fastapi==0.141.1",
  "httpx2==2.13.1",
  "jsonschema==4.26.0",
  "pytest==8.4.1",
  "python-multipart==0.0.32",
  # P2 cloud-adapter test dependencies (integration tests skip without emulators).
  "SQLAlchemy==2.0.54",
  "psycopg==3.3.6",
  "alembic==1.20.0",
  "azure-storage-blob==12.30.3",
  "azure-servicebus==7.14.3",
  "azure-identity==1.25.3",
]
api = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "python-multipart==0.0.32",
]
# P2 control plane (PostgreSQL). See requirements-postgres.txt for the pinned lock.
postgres = [
  "SQLAlchemy==2.0.54",
  "psycopg==3.3.6",
  "alembic==1.20.0",
]
# P2 cloud data plane + queue (Azure). See requirements-azure.txt for the lock.
cloud = [
  "azure-storage-blob==12.30.3",
  "azure-servicebus==7.14.3",
  "azure-identity==1.25.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
