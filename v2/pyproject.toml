[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "footballai-v2"
version = "0.1.0"
description = "Professional V2 platform for FootballAi"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "fastapi==0.140.0",
  "httpx2==2.9.1",
  "jsonschema==4.25.1",
  "pytest==8.4.1",
  "python-multipart==0.0.22",
]
api = [
  "fastapi==0.140.0",
  "uvicorn==0.51.0",
  "python-multipart==0.0.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
